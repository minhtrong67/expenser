<style>
:root{
  --primary:#36618E;--on-primary:#fff;--primary-container:#D1E4FF;--on-primary-container:#194975;
  --secondary:#535F70;--secondary-container:#D7E3F7;--on-secondary-container:#3B4858;
  --tertiary:#6B5778;--tertiary-container:#F2DAFF;--on-tertiary-container:#523F5F;
  --surface:#F8F9FF;--on-surface:#191C20;--on-surface-variant:#43474E;
  --sc-low:#F2F3FA;--sc:#ECEEF4;--sc-high:#E6E8EE;--sc-highest:#E1E2E8;
  --outline:#73777F;--outline-variant:#C3C7CF;
  --income:#006D38;--income-container:#8DF9AC;--on-income-container:#00210D;
  --expense:#BA1A1A;--expense-container:#FFDAD6;--on-expense-container:#93000A;
  --hov:.08;--prs:.12;--ease:cubic-bezier(.2,0,0,1);--ease-d:cubic-bezier(.05,.7,.1,1);
  --elev1:0 1px 2px rgb(0 0 0/.25),0 1px 3px 1px rgb(0 0 0/.12);
  --elev2:0 1px 2px rgb(0 0 0/.25),0 2px 6px 2px rgb(0 0 0/.12);
  --elev3:0 2px 4px rgb(0 0 0/.25),0 8px 20px 4px rgb(0 0 0/.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;background:var(--surface);color:var(--on-surface);line-height:1.5;overflow-x:hidden;transition:background .4s var(--ease),color .4s var(--ease)}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.wrap{width:min(1160px,100% - 40px);margin-inline:auto}
section{position:relative;padding:clamp(56px,9vw,112px) 0}

/* ---- buttons (M3) ---- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 28px;border-radius:999px;font-weight:500;font-size:15px;letter-spacing:.01em;transition:box-shadow .25s var(--ease),transform .25s var(--ease),background .25s}
.btn::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s}
.btn:hover::before{opacity:var(--hov,.08)}.btn:active::before{opacity:var(--prs,.12)}
.btn:active{transform:scale(.97)}
.btn-filled{background:var(--primary);color:var(--on-primary)}
.btn-filled:hover{box-shadow:var(--elev2)}
.btn-tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn-outlined{border:1px solid var(--outline);color:var(--primary)}
.btn-sm{height:40px;padding:0 20px;font-size:14px}
.wave{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:wave .6s var(--ease) forwards;pointer-events:none}
@keyframes wave{to{transform:scale(1);opacity:0}}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--on-surface-variant);position:relative;overflow:hidden;transition:background .2s}
.icon-btn:hover{background:color-mix(in srgb,var(--on-surface) var(--hover-mix,8%),transparent)}

/* ---- nav ---- */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;padding-top:env(safe-area-inset-top);transition:background .3s,box-shadow .3s,backdrop-filter .3s}
.nav.scrolled{background:color-mix(in srgb,var(--sc) 88%,transparent);backdrop-filter:blur(14px);box-shadow:var(--elev1)}
.nav-in{display:flex;align-items:center;height:64px;gap:8px}
.brand{font-size:22px;font-weight:700;color:var(--primary);letter-spacing:-.01em;margin-right:auto}
.links{display:flex;gap:4px;margin-right:12px}
.links a{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--on-surface-variant);transition:background .2s,color .2s}
.links a:hover{background:color-mix(in srgb,var(--on-surface) var(--hover-mix,8%),transparent);color:var(--on-surface)}
.lang{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:999px;font-weight:500;font-size:14px;color:var(--on-surface-variant)}
.lang:hover{background:color-mix(in srgb,var(--on-surface) var(--hover-mix,8%),transparent)}

/* ---- hero ---- */
.hero{padding-top:calc(64px + clamp(40px,7vw,96px));overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none;animation:float 14s ease-in-out infinite}
.blob.a{width:420px;height:420px;background:var(--primary-container);top:-120px;right:-100px}
.blob.b{width:360px;height:360px;background:var(--tertiary-container);bottom:-80px;left:-120px;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,24px) scale(1.08)}}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;position:relative}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:8px;background:var(--secondary-container);color:var(--on-secondary-container);font-size:13px;font-weight:500}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--income);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--income) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
h1{font-size:clamp(38px,6.4vw,68px);line-height:1.04;font-weight:900;letter-spacing:-.025em;margin:20px 0}
h1 em{font-style:normal;background:linear-gradient(120deg,var(--primary),var(--tertiary));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(16px,2vw,19px);color:var(--on-surface-variant);max-width:520px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.badges{display:flex;flex-wrap:wrap;gap:20px;margin-top:36px;color:var(--on-surface-variant);font-size:13px}
.badges span{display:inline-flex;align-items:center;gap:6px}
.badges svg{color:var(--primary)}

/* phone mockup */
.stage{position:relative;display:flex;justify-content:center;perspective:1200px}
.phone{width:min(300px,78vw);aspect-ratio:9/18.5;border-radius:42px;background:var(--sc-low);border:8px solid var(--on-surface);box-shadow:var(--elev3);padding:16px 14px;overflow:hidden;transform:rotateY(-8deg) rotateX(4deg);transition:transform .8s var(--ease-d);animation:bob 6s ease-in-out infinite}
.stage:hover .phone{transform:rotateY(0) rotateX(0)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -12px}}
.ph-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--primary);font-size:15px;margin-bottom:12px}
.ph-card{border-radius:22px;padding:16px;background:var(--primary-container);color:var(--on-primary-container)}
.ph-card small{font-size:11px;opacity:.8}
.ph-card b{display:block;font-size:24px;letter-spacing:-.01em}
.ph-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ph-mini{border-radius:16px;padding:10px 12px;font-size:11px}
.ph-mini b{display:block;font-size:14px}
.in{background:var(--income-container);color:var(--on-income-container)}
.out{background:var(--expense-container);color:var(--on-expense-container)}
.bars{display:flex;align-items:flex-end;gap:6px;height:84px;margin:14px 2px 8px}
.bars i{flex:1;border-radius:6px 6px 2px 2px;background:var(--primary);transform-origin:bottom;transform:scaleY(0);animation:grow 1s var(--ease-d) forwards}
.bars i:nth-child(even){background:var(--tertiary);opacity:.8}
@keyframes grow{to{transform:scaleY(1)}}
.ph-li{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:12px;animation:slide .6s var(--ease-d) both}
.ph-li .d{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--secondary-container);font-size:14px}
.ph-li span{flex:1}.ph-li b{font-variant-numeric:tabular-nums}
@keyframes slide{from{opacity:0;transform:translateY(14px)}}
.float-card{position:absolute;background:var(--sc-high);border-radius:20px;padding:12px 16px;box-shadow:var(--elev2);font-size:12px;display:flex;align-items:center;gap:10px;animation:bob 5s ease-in-out infinite}
.float-card.f1{left:0;top:18%;animation-delay:-1s}.float-card.f2{right:0;bottom:16%;animation-delay:-3s}
.float-card .ic{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center}

/* ---- reveal ---- */
.rv{opacity:0;transform:translateY(32px);transition:opacity .8s var(--ease-d),transform .8s var(--ease-d);transition-delay:var(--d,0s)}
.rv.show{opacity:1;transform:none}

/* ---- headings ---- */
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--primary)}
h2{font-size:clamp(28px,4.4vw,46px);line-height:1.12;font-weight:700;letter-spacing:-.02em;margin:10px 0 14px}
.sub{color:var(--on-surface-variant);font-size:clamp(15px,1.8vw,18px);max-width:640px}
.center{text-align:center}.center .sub{margin-inline:auto}

/* ---- features ---- */
.grid{display:grid;gap:16px;margin-top:48px}
.g3{grid-template-columns:repeat(3,1fr)}
.card{position:relative;border-radius:28px;padding:28px;background:var(--sc-low);transition:transform .4s var(--ease-d),box-shadow .4s,background .3s;overflow:hidden}
.card:hover{transform:translateY(-6px);box-shadow:var(--elev2);background:var(--sc)}
.card .ic{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;background:var(--primary-container);color:var(--on-primary-container);transition:transform .4s var(--ease-d)}
.card:hover .ic{transform:rotate(-8deg) scale(1.08)}
.card:nth-child(3n+2) .ic{background:var(--secondary-container);color:var(--on-secondary-container)}
.card:nth-child(3n) .ic{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.card h3{font-size:19px;font-weight:700;margin-bottom:8px}
.card p{color:var(--on-surface-variant);font-size:15px}

/* ---- showcase ---- */
.showcase{background:var(--sc-low)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 8px}
.sw{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .3s var(--ease-d),box-shadow .3s}
.sw:hover{transform:scale(1.15)}
.sw.on{box-shadow:0 0 0 3px var(--sc-low),0 0 0 5px var(--primary)}
.sw svg{opacity:0;transform:scale(.4);transition:.3s var(--ease-d)}.sw.on svg{opacity:1;transform:none}
.hint{font-size:13px;color:var(--on-surface-variant)}
.panel{border-radius:32px;background:var(--surface);padding:22px;box-shadow:var(--elev2)}
.pn-head{display:flex;gap:8px;margin-bottom:16px}
.pn-head i{width:10px;height:10px;border-radius:50%;background:var(--outline-variant)}
.seg{display:flex;border:1px solid var(--outline);border-radius:999px;overflow:hidden;height:40px;margin-bottom:14px}
.seg div{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
.seg .act{background:var(--secondary-container);color:var(--on-secondary-container)}
.field{background:var(--sc-highest);border-radius:10px 10px 0 0;border-bottom:2px solid var(--primary);padding:8px 14px;margin-bottom:14px}
.field small{font-size:11px;color:var(--primary);display:block}
.field b{font-size:20px;font-variant-numeric:tabular-nums}
.pn-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pn-chips span{height:30px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;font-size:12px;font-weight:500;border:1px solid var(--outline);color:var(--on-surface-variant)}
.pn-chips .sel{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.pn-btn{height:44px;border-radius:999px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px}

/* ---- steps ---- */
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
.step{position:relative;padding:32px 28px;border-radius:28px;background:var(--sc-low)}
.step::before{counter-increment:s;content:counter(s);display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-weight:700;margin-bottom:18px;box-shadow:var(--elev1)}
.step h3{font-size:18px;margin-bottom:6px}.step p{color:var(--on-surface-variant);font-size:15px}

/* ---- stats ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px}
.stat{border-radius:28px;padding:28px 20px;text-align:center;background:var(--primary-container);color:var(--on-primary-container)}
.stat:nth-child(2){background:var(--secondary-container);color:var(--on-secondary-container)}
.stat:nth-child(3){background:var(--tertiary-container);color:var(--on-tertiary-container)}
.stat:nth-child(4){background:var(--income-container);color:var(--on-income-container)}
.stat b{display:block;font-size:clamp(34px,5vw,52px);font-weight:900;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:14px;opacity:.85}

/* ---- tech / credit ---- */
.tech{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
.tech span{height:36px;padding:0 16px;border-radius:10px;display:inline-flex;align-items:center;background:var(--sc-high);font-size:14px;font-weight:500;transition:transform .3s var(--ease-d),background .3s}
.tech span:hover{transform:translateY(-3px);background:var(--secondary-container)}
.credit{margin-top:56px;border-radius:36px;padding:clamp(24px,4vw,40px);background:linear-gradient(135deg,var(--primary-container),var(--secondary-container) 55%,var(--tertiary-container));color:var(--on-primary-container);position:relative;overflow:hidden}
.credit::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--primary);opacity:.08;right:-60px;top:-80px}
.credit .eyebrow{color:inherit;opacity:.75}
.cr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;position:relative}
.cr{display:flex;align-items:center;gap:14px;border-radius:24px;padding:18px;background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(8px);transition:transform .4s var(--ease-d)}
.cr:hover{transform:translateY(-4px) scale(1.01)}
.cr .ic{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--elev1)}
.cr small{color:var(--on-surface-variant);font-size:12px;display:block}
.cr b{font-size:22px;font-weight:900}
.cr.a b{color:var(--primary)}.cr.a .ic{background:var(--primary);color:var(--on-primary)}
.cr.b b{color:var(--tertiary)}.cr.b .ic{background:var(--tertiary);color:#fff}

/* ---- final cta + footer ---- */
.final{text-align:center}
.final .box{border-radius:44px;padding:clamp(40px,7vw,80px) 24px;background:var(--primary);color:var(--on-primary);position:relative;overflow:hidden}
.final .box::before,.final .box::after{content:"";position:absolute;border-radius:50%;background:var(--on-primary);opacity:.08;animation:float 12s ease-in-out infinite}
.final .box::before{width:300px;height:300px;left:-80px;top:-100px}.final .box::after{width:360px;height:360px;right:-100px;bottom:-140px;animation-delay:-5s}
.final h2{position:relative}.final p{position:relative;opacity:.85;max-width:520px;margin:0 auto 28px}
.final .btn{position:relative;background:var(--on-primary);color:var(--primary)}
footer{padding:36px 0 calc(36px + env(safe-area-inset-bottom));text-align:center;color:var(--on-surface-variant);font-size:14px}

/* ---- responsive ---- */
@media(max-width:980px){
  .hero-grid,.split{grid-template-columns:1fr}
  .hero-grid{gap:56px}.hero .lead{max-width:none}
  .g3{grid-template-columns:repeat(2,1fr)}
  .links{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .split .panel-wrap{order:2}
}
@media(max-width:640px){
  .wrap{width:min(1160px,100% - 32px)}
  .g3,.steps,.cr-grid{grid-template-columns:1fr}
  .cta .btn{flex:1 1 100%}
  .float-card{display:none}
  .nav-in .btn{display:none}
  .card{padding:22px;border-radius:24px}
  .blob.a{width:280px;height:280px}.blob.b{width:240px;height:240px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>

const root=document.documentElement;
const KEY='expenser-landing';
let app={};try{app=JSON.parse(localStorage.getItem('qlct:settings'))||{}}catch(e){}
let own={};try{own=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const prefersDark=matchMedia('(prefers-color-scheme: dark)');
const state={
  lang:own.lang||app.language||((navigator.language||'vi').toLowerCase().startsWith('vi')?'vi':'en'),
  mode:own.mode||(app.themeMode&&app.themeMode!=='system'?app.themeMode:null),
  preset:own.preset||(Object.keys(PRESETS).find(k=>PRESETS[k].seed.toLowerCase()===(app.seedColor||'').toLowerCase())||'blue')
};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const kebab=s=>s.replace(/[A-Z]/g,m=>'-'+m.toLowerCase());
const MAP={sc:'surfaceContainer'};
function applyTheme(){
  const dark=state.mode?state.mode==='dark':prefersDark.matches;
  const p=PRESETS[state.preset][dark?'dark':'light'];
  const set=(n,k)=>root.style.setProperty('--'+n,p[k]);
  ['primary','onPrimary','primaryContainer','onPrimaryContainer','secondary','secondaryContainer','onSecondaryContainer','tertiary','tertiaryContainer','onTertiaryContainer','surface','onSurface','onSurfaceVariant','outline','outlineVariant','income','incomeContainer','onIncomeContainer','expense','expenseContainer','onExpenseContainer'].forEach(k=>set(kebab(k),k));
  root.style.setProperty('--on-primary',p.onPrimary);
  root.style.setProperty('--sc-low',p.surfaceContainerLow);root.style.setProperty('--sc',p.surfaceContainer);
  root.style.setProperty('--sc-high',p.surfaceContainerHigh);root.style.setProperty('--sc-highest',p.surfaceContainerHighest);
  root.style.colorScheme=dark?'dark':'light';
  root.style.setProperty('--hov',dark?'.05':'.08');root.style.setProperty('--prs',dark?'.08':'.12');
  root.style.setProperty('--hover-mix',dark?'5%':'8%');
  document.querySelector('meta[name=theme-color]').content=p.surface;
  document.getElementById('modeUse').setAttribute('href',dark?'#i-sun':'#i-moon');
  document.querySelectorAll('.sw').forEach(b=>{const on=b.dataset.id===state.preset;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
}
function applyLang(){
  const d=I18N[state.lang];root.lang=state.lang;
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=d[el.dataset.i]});
  document.getElementById('langTxt').textContent=state.lang.toUpperCase();
  document.title=state.lang==='vi'?'Expenser — Quản lý chi tiêu cá nhân thông minh':'Expenser — Smart personal expense tracker';
  document.querySelectorAll('[data-count][data-fmt]').forEach(el=>{el.textContent=fmt(+el.dataset.count)});
}
const fmt=n=>n.toLocaleString(state.lang==='vi'?'vi-VN':'en-GB')+' ₫';

// swatches
const sw=document.getElementById('swatches');
Object.entries(PRESETS).forEach(([id,p])=>{
  const b=document.createElement('button');b.className='sw';b.dataset.id=id;b.style.background=p.seed;b.setAttribute('role','radio');b.setAttribute('aria-label',id);
  b.innerHTML='<svg width="22" height="22"><use href="#i-check"/></svg>';
  b.onclick=()=>{state.preset=id;save();applyTheme()};
  sw.appendChild(b);
});
document.getElementById('langBtn').onclick=()=>{state.lang=state.lang==='vi'?'en':'vi';save();applyLang()};
document.getElementById('modeBtn').onclick=()=>{const dark=state.mode?state.mode==='dark':prefersDark.matches;state.mode=dark?'light':'dark';save();applyTheme()};
prefersDark.addEventListener('change',()=>{if(!state.mode)applyTheme()});
applyTheme();applyLang();

// nav shadow
const nav=document.getElementById('nav');
const onScroll=()=>nav.classList.toggle('scrolled',scrollY>12);
addEventListener('scroll',onScroll,{passive:true});onScroll();

// reveal on scroll + count-up
const ease=t=>1-Math.pow(1-t,4);
function countUp(el){
  const target=+el.dataset.count,suf=el.dataset.suf||'',money=el.dataset.fmt,t0=performance.now(),dur=1400;
  (function tick(now){const p=Math.min((now-t0)/dur,1),v=Math.round(target*ease(p));el.textContent=money?fmt(v):v+suf;if(p<1)requestAnimationFrame(tick)})(t0);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;
  e.target.classList.add('show');
  e.target.querySelectorAll('[data-count]:not([data-fmt])').forEach(countUp);
  io.unobserve(e.target);
}),{threshold:.15,rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
setTimeout(()=>document.querySelectorAll('[data-count][data-fmt]').forEach(countUp),500);

// ripple
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.btn,.icon-btn,.lang');if(!el)return;
  if(!/btn|icon-btn/.test(el.className))return;
  const r=el.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,w=document.createElement('span');
  w.className='wave';w.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
  el.appendChild(w);w.addEventListener('animationend',()=>w.remove());
},{passive:true});
</script>
