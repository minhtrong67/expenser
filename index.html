    <!--
      Splash colours that work even if the script below cannot run: follow the OS
      theme. (The <meta name="theme-color"> light/dark pair and the iOS startup
      images are injected by the adaptiveSplash plugin in vite.config.js.)
    -->
    <style>
      html { background: #f8f9ff; }
      .splash { display: flex; min-height: 100dvh; align-items: center; justify-content: center; background: rgb(var(--md-surface, 248 249 255)); }
      .splash-spinner { width: 2.5rem; height: 2.5rem; border-radius: 9999px; border: 3px solid rgb(var(--md-primary-container, 209 228 255)); border-top-color: rgb(var(--md-primary, 54 97 142)); animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) { html { background: #111418; } }
    </style>

    <!--
      Paints the user's saved theme before the stylesheet and React load, so
      there is no white flash (dark mode) and no colour jump (custom theme
      colour). Mirrors the storage keys used by SettingsContext / src/theme.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var s = JSON.parse(localStorage.getItem('qlct:settings') || '{}');
          var mode = s.themeMode || 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) root.classList.add('dark');
          var color = dark ? '#111418' : '#F8F9FF';
          var c = JSON.parse(localStorage.getItem('qlct:scheme') || 'null');
          if (c && c.seed === s.seedColor && c.css) {
            root.style.cssText += ';' + (dark ? c.css.dark : c.css.light);
            color = (dark ? c.scheme.dark : c.scheme.light).surface;
          }
          // The in-app theme wins over the OS one: drop the media queries and
          // use a single colour. Also paint the page itself so the splash never flashes.
          root.style.backgroundColor = color;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.removeAttribute('media');
            m.setAttribute('content', color);
          });
          if (s.language === 'en') root.lang = 'en';
        } catch (e) {
          /* storage unavailable (private mode...) - defaults apply */
        }
      })();
    </script>
